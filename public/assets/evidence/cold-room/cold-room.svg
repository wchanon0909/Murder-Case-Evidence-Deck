<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="ภายในห้องเย็นเก็บตัวอย่าง มีประตูหนา ชั้นวางตัวอย่าง และรอยลากบนพื้นน้ำแข็ง">
  <defs>
    <linearGradient id="crWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3542"/>
      <stop offset="1" stop-color="#0d1d26"/>
    </linearGradient>
    <linearGradient id="crFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#233f4b"/>
      <stop offset="1" stop-color="#0f2129"/>
    </linearGradient>
    <linearGradient id="crDoor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b6470"/>
      <stop offset="0.5" stop-color="#7d99a5"/>
      <stop offset="1" stop-color="#3c525d"/>
    </linearGradient>
    <radialGradient id="crVig" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#crWall)"/>
  <path d="M0 470 H1200 V800 H0 Z" fill="url(#crFloor)"/>
  <path d="M0 470 H1200" stroke="#456674" stroke-width="3"/>

  <!-- frost haze -->
  <g fill="#cfeaf5" opacity="0.06">
    <ellipse cx="300" cy="380" rx="320" ry="180"/>
    <ellipse cx="900" cy="420" rx="360" ry="200"/>
  </g>

  <!-- heavy door on the left -->
  <g>
    <rect x="90" y="120" width="280" height="420" fill="url(#crDoor)" stroke="#9fbcc7" stroke-width="4"/>
    <rect x="112" y="142" width="236" height="376" fill="none" stroke="#5e7c88" stroke-width="2"/>
    <rect x="330" y="300" width="46" height="90" rx="10" fill="#2c3f49" stroke="#a8c4cf" stroke-width="3"/>
    <!-- door sensor (hotspot 20%,34% = 240,272) -->
    <g>
      <rect x="204" y="232" width="72" height="80" rx="6" fill="#22333c" stroke="#a8c4cf" stroke-width="3"/>
      <rect x="216" y="246" width="48" height="52" fill="#4a5f6a"/>
      <g opacity="0.85">
        <rect x="210" y="240" width="60" height="64" fill="#d8e6ea" opacity="0.5"/>
        <path d="M210 240 h60 v64 h-60 z" fill="none" stroke="#e9f4f7" stroke-width="2" stroke-dasharray="4 4"/>
      </g>
      <circle cx="240" cy="330" r="6" fill="#5a6d76"/>
      <text x="188" y="360" font-family="'Courier New',monospace" font-size="15" fill="#a8c4cf">DOOR SENSOR</text>
    </g>
  </g>

  <!-- sample racks (hotspot 79%,62% = 948,496) -->
  <g>
    <rect x="850" y="200" width="290" height="330" fill="#16303a" stroke="#5a7d8b" stroke-width="3"/>
    <g stroke="#5a7d8b" stroke-width="2.5">
      <path d="M850 290 h290 M850 380 h290 M850 470 h290"/>
    </g>
    <g fill="#7fc4d6" opacity="0.8">
      <rect x="866" y="248" width="12" height="36"/><rect x="886" y="248" width="12" height="36"/>
      <rect x="906" y="248" width="12" height="36"/><rect x="926" y="248" width="12" height="36"/>
      <rect x="866" y="338" width="12" height="36"/><rect x="886" y="338" width="12" height="36"/>
      <rect x="906" y="338" width="12" height="36"/><rect x="966" y="338" width="12" height="36"/>
      <rect x="866" y="428" width="12" height="36"/><rect x="906" y="428" width="12" height="36"/>
      <rect x="946" y="428" width="12" height="36"/><rect x="986" y="428" width="12" height="36"/>
    </g>
    <text x="864" y="512" font-family="'Courier New',monospace" font-size="15" fill="#9fd0dd">RACK B — บัญชีครบ</text>
  </g>

  <!-- repair notice (hotspot 82%,30% = 984,240) is on a small board -->
  <g transform="rotate(-4 984 240)">
    <rect x="906" y="196" width="180" height="94" fill="#e6dfc8" stroke="#b3a684" stroke-width="2"/>
    <rect x="906" y="196" width="180" height="22" fill="#b3512f"/>
    <text x="916" y="212" font-family="'Courier New',monospace" font-size="13" fill="#f7efe0">MAINTENANCE</text>
    <g font-family="'Courier New',monospace" font-size="12" fill="#3d3527">
      <text x="916" y="242">THERMOSTAT</text>
      <text x="916" y="260">ค้าง 03/2026</text>
      <text x="916" y="278">รอช่างตรวจ</text>
    </g>
  </g>

  <!-- drag marks on the icy floor (hotspot 52%,74% = 624,592) -->
  <g>
    <path d="M330 528 C450 560 560 588 760 612" stroke="#dff1f8" stroke-width="26" fill="none" opacity="0.30" stroke-linecap="round"/>
    <path d="M330 552 C452 584 566 612 764 636" stroke="#dff1f8" stroke-width="16" fill="none" opacity="0.24" stroke-linecap="round"/>
    <path d="M330 528 C450 560 560 588 760 612" stroke="#f2fbff" stroke-width="2" fill="none" opacity="0.55"/>
    <g fill="#8f6f4a" opacity="0.85">
      <circle cx="612" cy="596" r="4"/><circle cx="646" cy="604" r="3"/>
      <circle cx="672" cy="600" r="4"/><circle cx="700" cy="610" r="3"/>
    </g>
    <text x="470" y="676" font-family="'Courier New',monospace" font-size="15" fill="#bcdde8">รอยลากจากธรณีประตูถึงจุดพบศพ</text>
  </g>

  <!-- body outline marker -->
  <g opacity="0.75">
    <path d="M770 600 q40 -18 78 -6 q34 12 26 44 q-10 36 -58 34 q-52 -2 -58 -32 q-4 -26 12 -40 z"
          fill="none" stroke="#f3c76b" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="768" y="700" font-family="'Courier New',monospace" font-size="15" fill="#f3c76b">POSITION OF BODY</text>
  </g>

  <!-- temperature readout -->
  <g>
    <rect x="470" y="120" width="230" height="86" rx="6" fill="#0b1b22" stroke="#5a7d8b" stroke-width="2"/>
    <text x="486" y="152" font-family="'Courier New',monospace" font-size="14" fill="#7fa8b6">CHAMBER TEMP</text>
    <text x="486" y="192" font-family="'Courier New',monospace" font-size="32" fill="#7fe3f5">−20.0 °C</text>
  </g>

  <g font-family="'Courier New',monospace" font-size="16" fill="#7fa8b6">
    <text x="60" y="68">EVIDENCE 09 — COLD STORAGE ROOM · FLOOR 24</text>
  </g>

  <rect width="1200" height="800" fill="url(#crVig)"/>
</svg>
