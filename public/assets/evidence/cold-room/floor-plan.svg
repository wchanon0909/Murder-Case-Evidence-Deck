<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="ผังชั้น 24 แสดงห้องแล็บวิเคราะห์ ห้องเย็น และเส้นทางเข้าออก">
  <defs>
    <linearGradient id="fpBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2129"/>
      <stop offset="1" stop-color="#071319"/>
    </linearGradient>
    <pattern id="fpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d4a58" stroke-width="1" opacity="0.45"/>
    </pattern>
    <radialGradient id="fpVig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#fpBg)"/>
  <rect width="1200" height="800" fill="url(#fpGrid)"/>

  <g fill="none" stroke="#6fd3e8" stroke-width="4">
    <rect x="70" y="90" width="1060" height="620"/>
  </g>

  <!-- room blocks -->
  <g stroke="#4ea6bd" stroke-width="2.5" fill="#0f2c36">
    <rect x="100" y="120" width="250" height="240"/>
    <rect x="100" y="400" width="250" height="280"/>
    <rect x="390" y="120" width="330" height="240"/>
    <rect x="760" y="120" width="340" height="240"/>
    <rect x="760" y="470" width="340" height="210"/>
    <rect x="390" y="470" width="330" height="210"/>
  </g>

  <g font-family="'Courier New',monospace" fill="#9fe4f2" font-size="21" letter-spacing="1">
    <text x="118" y="152">โถงลิฟต์ / ประตูควบคุม</text>
    <text x="118" y="432">ห้องประชุมชั้น 24</text>
    <text x="408" y="152">ห้องทำงานผู้อำนวยการ</text>
    <text x="778" y="152">ห้องแล็บวิเคราะห์</text>
    <text x="778" y="502">ห้องเย็นเก็บตัวอย่าง −20°C</text>
    <text x="408" y="502">ห้องเก็บของ / ตู้เอกสาร</text>
  </g>

  <!-- service corridor connecting lab and cold room -->
  <g>
    <rect x="700" y="380" width="400" height="70" fill="#123b46" stroke="#7fe3f5" stroke-width="2.5" stroke-dasharray="10 7"/>
    <text x="716" y="424" font-family="'Courier New',monospace" font-size="20" fill="#c9f4ff">ทางเดินบริการ — ไม่มีกล้อง</text>
    <path d="M900 360 V380 M900 450 V470" stroke="#7fe3f5" stroke-width="3"/>
  </g>

  <!-- camera cones -->
  <g fill="#f3c76b" opacity="0.16">
    <path d="M360 130 L470 250 L250 250 Z"/>
    <path d="M1090 130 L1090 300 L900 210 Z"/>
  </g>
  <g fill="#f3c76b" font-family="'Courier New',monospace" font-size="16">
    <circle cx="360" cy="130" r="7"/><text x="330" y="118">CAM-1</text>
    <circle cx="1090" cy="130" r="7"/><text x="1030" y="118">CAM-2</text>
  </g>

  <!-- main card door (hotspot 16%,33% = 192,264) -->
  <g>
    <path d="M100 230 H180" stroke="#f3c76b" stroke-width="8"/>
    <rect x="176" y="240" width="34" height="52" rx="5" fill="#1b3d47" stroke="#f3c76b" stroke-width="3"/>
    <path d="M186 258 h14 M186 268 h14 M186 278 h9" stroke="#f3c76b" stroke-width="3"/>
    <text x="150" y="330" font-family="'Courier New',monospace" font-size="18" fill="#f7d98f">CARD READER</text>
  </g>

  <!-- service lift (hotspot 79%,70% = 948,560) -->
  <g>
    <rect x="900" y="512" width="96" height="96" fill="#16323b" stroke="#e07a5f" stroke-width="3"/>
    <path d="M912 560 h72 M948 528 v64" stroke="#e07a5f" stroke-width="3"/>
    <rect x="880" y="620" width="150" height="26" fill="#e07a5f" opacity="0.35"/>
    <text x="890" y="639" font-family="'Courier New',monospace" font-size="16" fill="#ffd9cd">OUT OF SERVICE</text>
  </g>

  <!-- evacuation notice (hotspot 87%,20% = 1044,160) -->
  <g>
    <rect x="1000" y="128" width="88" height="64" rx="4" fill="#0e3a2c" stroke="#67c2a8" stroke-width="3"/>
    <path d="M1016 176 l14 -26 l14 26 z" fill="#67c2a8"/>
    <text x="1052" y="168" font-family="'Courier New',monospace" font-size="15" fill="#a8e6d4">EXIT</text>
  </g>

  <g font-family="'Courier New',monospace" fill="#6fd3e8" font-size="19" letter-spacing="2">
    <text x="70" y="70">FLOOR 24 — RESTRICTED RESEARCH WING</text>
    <text x="70" y="756">SCALE 1:150 · REVISED 04/2026 · เวชนวัตกรรม จำกัด (มหาชน)</text>
  </g>

  <rect width="1200" height="800" fill="url(#fpVig)"/>
</svg>
